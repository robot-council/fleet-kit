# Example seats file. It holds no real data: copy it to seats.toml in your private
# configuration repository (not a fork of fleet-kit) and edit.
# seat-pace reads the [[account]] tables. seat-stage reads channel, [[machine]] and [[seat]].
#
#   bin/seat-stage stage office --dry-run --config examples/seats.toml
#   bin/seat-stage stage desk   --dry-run --config examples/seats.toml

# The channel entry passed after --dangerously-load-development-channels: server:<name> or
# plugin:<name>@<marketplace>. The flag takes tagged entries only (fleet-kit#7).
channel = "server:robot-council"

# A machine's staging settings. multiplexer is tmux (macOS, Linux) or psmux (Windows).
[[machine]]
name = "office"
multiplexer = "tmux"
session = "fleet"
start = "enter"            # enter waits for a keypress, now starts at once, when-free waits for a free conversation
start_gap = "5s"           # when-free: pause between starts
confirm_channels = false   # true answers the channels warning for you; reads the pane with capture-pane (tmux and psmux)
remote_control = true      # pass --remote-control <name>

[[machine]]
name = "desk"
multiplexer = "psmux"
start = "now"

# A seat is one Claude Code conversation in one checkout, joined to the fleet in a role.
[[seat]]
machine = "office"
slot = "a"
repository = "example-org/example-repo"
checkout = "/home/example/src/example-repo"
role = "build"
work_location = "a"        # defaults to the slot; unique per machine; never a path
capacity = 1               # optional
# conversation = "00000000-0000-0000-0000-000000000000"   # `seat-stage collect` fills this in
prompt = "Take new work only by placement."   # optional, appended to the first message
# start = "enter"          # optional: this seat's own start mode (enter, now or when-free); omitted, it inherits the machine's

[[seat]]
machine = "office"
slot = "ci"
repository = "example-org/example-repo"
checkout = "/home/example/src/example-repo-ci"
role = "ci"
after = ["a"]              # start after these slots
conversation = "11111111-1111-1111-1111-111111111111"

# A Codex seat: started with `codex`, never woken by the fleet, no channel flag. See docs/restart.md.
[[seat]]
machine = "office"
slot = "codex"
repository = "example-org/example-repo"
checkout = "/home/example/src/example-repo-codex"
role = "build"
harness = "codex"
start = "enter"            # when-free cannot detect a held Codex conversation

[[seat]]
machine = "desk"
slot = "primary"
repository = "example-org/other-repo"
checkout = "C:/src/other-repo"
role = "build"

# Where `seat-pace log` and `watch` append. Relative paths are relative to this file.
log = "seat-pace.tsv"

# An allowance belongs to an account, not to a seat: every seat on the account bills the same one.
[[account]]
name = "main"
harness = "claude"        # the adapter that reads this allowance
machine = "office"        # the machine whose login can read it; set SEAT_PACE_MACHINE to override the hostname
# machine = ["office", "home"]   # or a list, the preferred first: "home" reads while the fleet shows "office"
#                                # absent (docs/pacing.md). Names are the machines' labels in the fleet.
timezone = "America/Chicago"
reset = "Mon 12:00"       # the configured reset is authoritative; the endpoint's resets_at is only a cross-check
hours = "working"         # "working" draws the line over working hours, "clock" over every hour
working_days = ["Mon", "Tue", "Wed", "Thu", "Fri"]
working_hours = "09:00-17:00"
dead_band = 0             # percentage points over the line before the verdict turns OVER

# Optional. A command whose output goes in the log's `extra` column, e.g. parked and unparked seats.
# log_extra = "./count-parked-seats"

# Optional. Run by `watch` when the verdict changes. It gets SEAT_PACE_ACCOUNT, SEAT_PACE_VERDICT
# and SEAT_PACE_PREVIOUS in its environment. The kit never acts on a verdict itself.
# on_change = "./notify-the-operator"
